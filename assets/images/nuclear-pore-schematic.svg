<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="title description">
<title id="title">Nuclear pore: a conceptual schematic</title>
<desc id="description">A conceptual cross-section of a nuclear pore, with flexible FG-nucleoporins and a cargo path across the nuclear envelope. Not to scale and not experimental data.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#4b647b" stroke-width="1.3"/></marker></defs>
<rect width="1040" height="400" fill="#e8ecee"/>
<g fill="#3b4750" font-family="'Segoe UI',Arial,sans-serif" font-size="17"><text x="44" y="58">CYTOPLASM</text><text x="44" y="348">NUCLEUS</text></g>
<g fill="#a9b8c4" stroke="#6e8194" stroke-width="1.5"><rect x="0" y="170" width="365" height="16"/><rect x="0" y="216" width="365" height="16"/><rect x="675" y="170" width="365" height="16"/><rect x="675" y="216" width="365" height="16"/></g>
<g fill="#7f93a3" stroke="#596e80" stroke-width="2"><path d="M363 146 Q342 200 363 254 L398 254 Q381 200 398 146 Z"/><path d="M677 146 Q698 200 677 254 L642 254 Q659 200 642 146 Z"/></g>
<g fill="none" stroke="#6e8194" stroke-width="3" stroke-linecap="round"><path d="M394 159 Q442 125 454 172 T500 185"/><path d="M390 186 Q423 220 453 197 T480 220"/><path d="M395 230 Q435 258 462 224 T505 237"/><path d="M647 158 Q607 188 582 163 T548 182"/><path d="M650 200 Q614 164 597 201 T554 213"/><path d="M647 238 Q610 260 588 230 T542 248"/></g>
<path d="M522 89 Q505 141 526 184 T521 307" fill="none" stroke="#4b647b" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
<circle cx="521" cy="110" r="13" fill="#c9a79a" stroke="#8d6c60" stroke-width="1.5"/>
<g fill="#3b4750" font-family="'Segoe UI',Arial,sans-serif" font-size="16"><text x="760" y="135">Nuclear envelope</text><text x="705" y="310">FG-nucleoporins</text><text x="570" y="91">Molecular cargo</text></g>
<g fill="none" stroke="#596873" stroke-width="1.2"><path d="M828 142 V168"/><path d="M724 291 L612 238"/><path d="M565 95 L537 105"/></g>
<text x="44" y="382" font-family="'Segoe UI',Arial,sans-serif" font-size="11" letter-spacing="1.4" fill="#596873">CONCEPTUAL SCHEMATIC · NOT TO SCALE</text>
